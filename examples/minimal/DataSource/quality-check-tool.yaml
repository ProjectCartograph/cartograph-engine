apiVersion: cartograph/v1
kind: DataSource
metadata:
  id: quality-check-tool
  name: Quality Check Tool
spec:
  name: Quality Check Tool
  category: formOrSurvey
  team: quality-team
  access: Paper forms transcribed into a shared spreadsheet each season.
  refresh: quarterly
  qualityIssues: Some forms arrive late and are transcribed after the season closes.
  # What one entry is, and the numbers it gives (TAXONOMY.md D64). Which
  # warehouse model holds it is the analyst's to say, outside Cartograph.
  records: One delivery checked against the quality standard at a depot's intake.
  metrics:
    - id: deliveries-checked
      name: Deliveries checked
      description: Every delivery checked at intake, passed or not.
      aggregation: COUNT(*)
    - id: deliveries-passed
      name: Deliveries passed
      description: Deliveries that met the standard when checked at intake.
      aggregation: COUNT(*) WHERE passed = true
