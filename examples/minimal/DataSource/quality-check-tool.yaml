apiVersion: cartograph/v1
kind: DataSource
metadata:
  id: quality-check-tool
  name: Quality Check Tool
spec:
  name: Quality Check Tool
  category: formOrSurvey
  team: quality-team
  access: Paper forms transcribed into a shared spreadsheet each season.
  refresh: quarterly
  qualityIssues: Some forms arrive late and are transcribed after the season closes.
  # Where its rows sit once loaded to the warehouse (TAXONOMY.md D57).
  semanticModel:
    model: stg_quality_checks
    entity: delivery_check
    key: check_id
    time: {column: checked_on, grain: day}
    dimensions:
      - {name: region, column: depot_region, segment: region}
      - {name: product_line, segment: product-line}
