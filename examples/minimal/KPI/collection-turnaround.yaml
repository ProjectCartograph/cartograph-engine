apiVersion: cartograph/v1
kind: KPI
metadata:
  id: collection-turnaround
  name: Collection turnaround
  labels: {pillar: quality}
spec:
  name: Collection turnaround
  definition: Median hours between a delivery being taken in and being collected from the depot.
  unit: hours
  direction: decrease
  baseline: {value: 41, date: "2025-09"}
  target: {value: 20, date: "2027-06"}
  source: collection-log
  cycle: monthly-cycle
  goals: [produce-reaches-a-depot-the-same-day, less-harvest-lost-after-picking]
  resultLevel: output
  disaggregations: [depot]
