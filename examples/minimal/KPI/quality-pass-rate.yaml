apiVersion: cartograph/v1
kind: KPI
metadata:
  id: quality-pass-rate
  name: Quality pass rate
  labels: {pillar: quality, pack: board}
spec:
  name: Quality pass rate
  definition: Share of deliveries meeting the quality standard at intake.
  unit: percent
  direction: increase
  baseline: {value: 62, date: "2025-09"}
  target: {value: 75, date: "2027-06"}
  sources: [quality-check-tool]
  cycle: seasonal-cycle
  # The pillar it moves, and the functional goal it measures directly:
  # the share meeting the standard at intake is what "faults found
  # before dispatch" means in a number.
  goals: [raise-produce-quality, faults-found-before-dispatch]
  resultLevel: outcome
  disaggregations: [region, product-line]
  # As the analytics engineer builds it (TAXONOMY.md D57): deliveries
  # passing, out of deliveries checked, in the check tool's rows.
  metric:
    type: ratio
    numerator: {source: quality-check-tool, agg: sum, expr: "case when passed then 1 else 0 end"}
    denominator: {source: quality-check-tool, agg: count}
  # What holding the gain asks of it (TAXONOMY.md D58): the share buyers
  # accept, and what the quality lead does when a season falls below it.
  specLimits: {lower: 60}
  response:
    trigger: A season's pass rate below the lower limit, or below the centre line eight seasons running
    action: Review that season's rejected deliveries with each depot and retrain the graders who passed them
    by: {kind: Resource, id: quality-reviewer}
    withinDays: 14
