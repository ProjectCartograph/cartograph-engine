apiVersion: cartograph/v1
kind: Operation
metadata:
  id: quality-check-service
  name: Quality Check Service
spec:
  name: Quality Check Service
  purpose: Check every delivery for quality and route failures into rework.
  team: quality-team
  serviceWindow: Every delivery day, ongoing.
  # What pays to run the service, for as long as it runs: a recurring
  # cost, so each line says the period its amount is for.
  funding:
    - amount: 18000
      currency: USD
      per: year
      source: operating-budget
      status: approved
  kpis: [quality-pass-rate]
  data:
    consumes:
      - source: member-register
        purpose: Identify members with deliveries due for a check this season.
        handoff: apiOrFeed
    produces:
      - output: recordsInExistingSource
        sink: quality-check-tool
        purpose: Record quality check results for each delivery.
        refresh: quarterly
        personalData: personal
