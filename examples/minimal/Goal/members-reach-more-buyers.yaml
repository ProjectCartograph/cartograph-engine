apiVersion: cartograph/v1
kind: Goal
metadata:
  id: members-reach-more-buyers
  name: Widen members' access to buyers
spec:
  level: objective
  parent: grow-member-livelihoods
  objective: Give a member's produce somewhere to go when one buyer walks away.
  whyItMatters: A single buyer sets the price when there is no second one.
  keyResults:
    - id: kr-active-buyers
      metric: buyers taking cooperative produce in a season
      direction: increase
      kind: count
      unit: buyers
      baseline: {value: 4, date: "2025-09"}
      target: {value: 9, date: "2026-06"}
  evidence: Buyer accounts active in the sales ledger, by season.
