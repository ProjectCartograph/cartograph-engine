{{- if and .Values.vault.enabled (not .Values.vault.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cartograph.fullname" . }}-vault
  labels:
    {{- include "cartograph.labels" . | nindent 4 }}
  annotations:
    # The vault is the only state; keep it when the release is removed.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.vault.persistence.accessModes | nindent 4 }}
  {{- with .Values.vault.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.vault.persistence.size }}
{{- end }}
