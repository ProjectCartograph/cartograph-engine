apiVersion: v1
kind: Service
metadata:
  name: {{ include "cartograph.fullname" . }}
  labels:
    {{- include "cartograph.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # No session affinity: any replica serves any request.
  sessionAffinity: None
  selector:
    {{- include "cartograph.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
