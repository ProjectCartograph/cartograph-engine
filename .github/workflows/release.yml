name: release

# A release is a tag v<VERSION> on main (VERSIONING.md). The binaries for
# both architectures, the images, the Helm chart and the notes come from
# the same flake that CI ran.
on:
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # The Nix store in the GitHub Actions cache, as one entry (no
      # per-path requests to be rate-limited).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'go.sum') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-release-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || (echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)" && exit 1)
      - run: nix develop --command just release
      - run: cd dist && sha256sum cartograph-linux-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cartograph-linux-amd64
            dist/cartograph-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true

  images:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # The Nix store in the GitHub Actions cache, as one entry (no
      # per-path requests to be rate-limited).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'go.sum') }}
          restore-prefixes-first-match: nix-image-${{ runner.os }}-${{ runner.arch }}-
          save: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The decision model gives on this architecture the answers recorded
      # on x86_64 (docs/adr/0030) before its image is published.
      - run: nix develop --command just decide-measure
      - name: build and push the images for this architecture
        run: |
          version=$(cat VERSION)
          repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cartograph
          for target in image image-chromium; do
            nix build .#$target --out-link result-$target
            name=$(docker load < result-$target | sed -n 's/^Loaded image: //p')
            suffix=""; [ "$target" = "image-chromium" ] && suffix="-chromium"
            docker tag "$name" "$repo:$version$suffix-${{ matrix.arch }}"
            docker push "$repo:$version$suffix-${{ matrix.arch }}"
          done
          nix build .#image-laya --out-link result-laya
          name=$(docker load < result-laya | sed -n 's/^Loaded image: //p')
          docker tag "$name" "$repo-laya:$version-${{ matrix.arch }}"
          docker push "$repo-laya:$version-${{ matrix.arch }}"

  manifest:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: one tag for both architectures
        run: |
          version=$(cat VERSION)
          repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cartograph
          for suffix in "" "-chromium"; do
            docker buildx imagetools create -t "$repo:$version$suffix" -t "$repo:latest$suffix" \
              "$repo:$version$suffix-amd64" "$repo:$version$suffix-arm64"
          done
          docker buildx imagetools create -t "$repo-laya:$version" -t "$repo-laya:latest" \
            "$repo-laya:$version-amd64" "$repo-laya:$version-arm64"

  # The Helm chart at VERSION, as an OCI artifact next to the images:
  # helm install cartograph oci://ghcr.io/<owner>/charts/cartograph --version <VERSION>
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # The Nix store in the GitHub Actions cache, as one entry (no
      # per-path requests to be rate-limited).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'go.sum') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-${{ runner.arch }}-
          save: false
      - run: nix develop --command just helm-lint
      - name: package and push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat VERSION)
          repo=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts
          nix develop --command helm package deploy/helm/cartograph --version "$version" --app-version "$version" --destination dist
          echo "$GITHUB_TOKEN" | nix develop --command helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          nix develop --command helm push "dist/cartograph-$version.tgz" "$repo"
