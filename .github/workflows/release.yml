name: release

# A release is a tag v<VERSION> on main (VERSIONING.md). The binaries for
# both architectures, the images, the Helm chart and the notes come from
# the same flake that CI ran.
on:
  push:
    tags: ["v*"]

# The Nix caches, each its own switch, so both may be on: the Actions
# cache (repository variable CARTOGRAPH_CACHE_GHA, on unless set to off)
# and Cachix (CARTOGRAPH_CACHIX, a cache name, with the secret
# CACHIX_AUTH_TOKEN; off unless set).
env:
  CARTOGRAPH_CACHE_GHA: ${{ vars.CARTOGRAPH_CACHE_GHA || 'on' }}
  CARTOGRAPH_CACHIX: ${{ vars.CARTOGRAPH_CACHIX }}

permissions:
  # magic-nix-cache asks for a token to reach the Actions cache.
  id-token: write
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built (docs/CONTAINERS.md, "CI").
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Images live in the registry; the cache keeps what builds them.
          pushFilter: '\.tar\.gz$'
      - run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || (echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)" && exit 1)
      # Every platform's binary and SHA256SUMS, cross-compiled on this
      # one Linux runner (docs/CROSS.md).
      - run: nix develop --command just release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Every image for both architectures, built on one x86_64 runner: an
  # image is files, and an arm64 one is put together from arm64's own
  # packages without running any of them (docs/CROSS.md).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built (docs/CONTAINERS.md, "CI").
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Images live in the registry; the cache keeps what builds them.
          pushFilter: '\.tar\.gz$'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push every image for both architectures
        run: |
          version=$(cat VERSION)
          repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cartograph
          for arch in amd64 arm64; do
            for target in image image-chromium image-laya; do
              case "$target" in
                image) tag="$repo:$version-$arch" ;;
                image-chromium) tag="$repo:$version-chromium-$arch" ;;
                image-laya) tag="$repo-laya:$version-$arch" ;;
              esac
              nix build ".#$target-linux-$arch" --out-link "result-$target-$arch"
              name=$(docker load < "result-$target-$arch" | sed -n 's/^Loaded image: //p')
              docker tag "$name" "$tag"
              docker push "$tag"
            done
          done

  # Each architecture's images, pulled and run on that architecture: the
  # binary answers ready, and the decision model gives the answers
  # recorded on x86_64 (docs/adr/0030), before any tag names them.
  verify:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built (docs/CONTAINERS.md, "CI").
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Images live in the registry; the cache keeps what builds them.
          pushFilter: '\.tar\.gz$'
      - name: the binary answers ready
        run: |
          repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cartograph
          docker run -d --name cartograph -p 8080:8080 "$repo:$(cat VERSION)-${{ matrix.arch }}"
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/readyz && exit 0; sleep 0.5; done
          docker logs cartograph; exit 1
      - name: the decision model answers as recorded
        run: |
          repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cartograph-laya
          docker run -d --name laya -p 8411:8411 "$repo:$(cat VERSION)-${{ matrix.arch }}"
          for _ in $(seq 1 120); do curl -sf http://localhost:8411/ready && break; sleep 1; done
          nix develop --command just decide-measure http://localhost:8411

  manifest:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: one tag for both architectures
        run: |
          version=$(cat VERSION)
          repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cartograph
          for suffix in "" "-chromium"; do
            docker buildx imagetools create -t "$repo:$version$suffix" -t "$repo:latest$suffix" \
              "$repo:$version$suffix-amd64" "$repo:$version$suffix-arm64"
          done
          docker buildx imagetools create -t "$repo-laya:$version" -t "$repo-laya:latest" \
            "$repo-laya:$version-amd64" "$repo-laya:$version-arm64"

  # The Helm chart at VERSION, as an OCI artifact next to the images:
  # helm install cartograph oci://ghcr.io/<owner>/charts/cartograph --version <VERSION>
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built (docs/CONTAINERS.md, "CI").
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Images live in the registry; the cache keeps what builds them.
          pushFilter: '\.tar\.gz$'
      - run: nix develop --command just helm-lint
      - name: package and push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat VERSION)
          repo=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts
          nix develop --command helm package deploy/helm/cartograph --version "$version" --app-version "$version" --destination dist
          echo "$GITHUB_TOKEN" | nix develop --command helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          nix develop --command helm push "dist/cartograph-$version.tgz" "$repo"
