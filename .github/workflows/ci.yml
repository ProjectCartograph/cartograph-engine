name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # cache-nix-action purges its own old entries.
  actions: write

jobs:
  # The same `just ci` a contributor runs, in the same test environment
  # (scripts/dev, docs/CONTAINERS.md), on both architectures the release
  # targets. The environment's Nix store is a directory kept in the
  # Actions cache, so a run fetches only what changed.
  ci:
    strategy:
      # Each architecture reports for itself; one failing must not hide
      # the other's result.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: store
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nix
          key: dev-nix-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'go.sum', 'deploy/dev/Containerfile') }}
          restore-keys: dev-nix-${{ runner.arch }}-
      - run: scripts/dev just ci
        env:
          # A step's own: the runner context is not there at the job's.
          CARTOGRAPH_NIX_STORE: ${{ runner.temp }}/nix
      # A new entry keeps what the development shell needs and nothing an
      # older flake left behind.
      - if: steps.store.outputs.cache-hit != 'true'
        run: scripts/dev sh -c 'nix develop --profile /nix/var/nix/profiles/dev-shell --command true && nix store gc'
        env:
          CARTOGRAPH_NIX_STORE: ${{ runner.temp }}/nix

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nix
          key: dev-nix-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'go.sum', 'deploy/dev/Containerfile') }}
          restore-keys: dev-nix-${{ runner.arch }}-
      - run: scripts/dev just commit-check origin/${{ github.base_ref }}
        env:
          # A step's own: the runner context is not there at the job's.
          CARTOGRAPH_NIX_STORE: ${{ runner.temp }}/nix

  # The binary and the image from the flake, on both architectures; the
  # image is started and asked whether it is ready.
  image:
    strategy:
      # Each architecture reports for itself; one failing must not hide
      # the other's result.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # The Nix store in the GitHub Actions cache, as one entry (no
      # per-path requests to be rate-limited).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'go.sum') }}
          restore-prefixes-first-match: nix-image-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-image-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - run: nix flake check --print-build-logs
      - run: nix run .#cartograph -- validate examples/minimal
      - run: nix build .#image --out-link result-image && docker load < result-image
      - name: seed a volume and start the container
        run: |
          tag=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^cartograph:' | head -n 1)
          docker volume create cartograph-vault
          docker run --rm -v cartograph-vault:/vault -v "$PWD/examples/minimal:/src:ro" busybox \
            sh -c 'cp -r /src/. /vault/ && chown -R 65532:65532 /vault'
          docker run -d --name cartograph -p 8080:8080 -v cartograph-vault:/vault "$tag"
      - name: ready
        run: |
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/readyz && exit 0; sleep 0.5; done
          docker logs cartograph; exit 1

  # The Helm chart: rendered and validated without a cluster, then
  # installed on a kind cluster with the image the flake builds, two
  # replicas on one Postgres, probed, and made to lose a pod.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # The Nix store in the GitHub Actions cache, as one entry (no
      # per-path requests to be rate-limited).
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-deploy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'go.sum') }}
          restore-prefixes-first-match: nix-deploy-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-deploy-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - run: nix develop --command just helm-lint helm-kind
