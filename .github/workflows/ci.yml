name: ci

on:
  push:
    branches: [main]
  pull_request:

# The Nix caches, each its own switch, so both may be on: the Actions
# cache (repository variable CARTOGRAPH_CACHE_GHA, on unless set to off)
# and Cachix (CARTOGRAPH_CACHIX, a cache name, with the secret
# CACHIX_AUTH_TOKEN; off unless set).
env:
  CARTOGRAPH_CACHE_GHA: ${{ vars.CARTOGRAPH_CACHE_GHA || 'on' }}
  CARTOGRAPH_CACHIX: ${{ vars.CARTOGRAPH_CACHIX }}

permissions:
  contents: read

jobs:
  # The same `just ci` a contributor runs, in the same flake, on both
  # architectures the release targets. CI runs on the runner itself: it
  # is a clean machine already, and Nix makes it the same environment as
  # the container people and agents use (docs/CONTAINERS.md).
  ci:
    strategy:
      # Each architecture reports for itself; one failing must not hide
      # the other's result.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built (docs/CONTAINERS.md, "CI").
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          # The Actions cache only: FlakeHub needs an account this
          # organisation does not have, and asking for it logs an error.
          use-flakehub: false
          use-gha-cache: true
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Images live in the registry; the cache keeps what builds them.
          pushFilter: '\.tar\.gz$'
      - run: nix develop .#ci --command just ci

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built (docs/CONTAINERS.md, "CI").
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          # The Actions cache only: FlakeHub needs an account this
          # organisation does not have, and asking for it logs an error.
          use-flakehub: false
          use-gha-cache: true
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Images live in the registry; the cache keeps what builds them.
          pushFilter: '\.tar\.gz$'
      - run: nix develop .#ci --command just commit-check origin/${{ github.base_ref }}

  # The binary and the image from the flake, on both architectures; the
  # image is started and asked whether it is ready.
  image:
    strategy:
      # Each architecture reports for itself; one failing must not hide
      # the other's result.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built (docs/CONTAINERS.md, "CI").
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          # The Actions cache only: FlakeHub needs an account this
          # organisation does not have, and asking for it logs an error.
          use-flakehub: false
          use-gha-cache: true
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Images live in the registry; the cache keeps what builds them.
          pushFilter: '\.tar\.gz$'
      - run: nix flake check --print-build-logs
      - run: nix run .#cartograph -- validate examples/minimal
      - run: nix build .#image --out-link result-image && docker load < result-image
      - name: seed a volume and start the container
        run: |
          tag=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^cartograph:' | head -n 1)
          docker volume create cartograph-vault
          docker run --rm -v cartograph-vault:/vault -v "$PWD/examples/minimal:/src:ro" busybox \
            sh -c 'cp -r /src/. /vault/ && chown -R 65532:65532 /vault'
          docker run -d --name cartograph -p 8080:8080 -v cartograph-vault:/vault "$tag"
      - name: ready
        run: |
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/readyz && exit 0; sleep 0.5; done
          docker logs cartograph; exit 1

  # The Helm chart: rendered and validated without a cluster, then
  # installed on a kind cluster with the image the flake builds, two
  # replicas on one Postgres, probed, and made to lose a pod.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Keep what the development shell and the builds were made
          # from, so the cached store rebuilds nothing.
          extra-conf: |
            keep-outputs = true
            keep-env-derivations = true
      # Every store path built here, by its own hash: in the Actions cache
      # (magic-nix-cache) and, where one is named, in Cachix; each fetched
      # by the next run instead of built (docs/CONTAINERS.md, "CI").
      - if: env.CARTOGRAPH_CACHE_GHA == 'on'
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          # The Actions cache only: FlakeHub needs an account this
          # organisation does not have, and asking for it logs an error.
          use-flakehub: false
          use-gha-cache: true
      - if: env.CARTOGRAPH_CACHIX != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CARTOGRAPH_CACHIX }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Images live in the registry; the cache keeps what builds them.
          pushFilter: '\.tar\.gz$'
      - run: nix develop --command just helm-lint helm-kind
