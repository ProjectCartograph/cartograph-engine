# A local rehearsal of the highly available topology (docs/DEPLOYMENT.md,
# "Large-scale, highly available"): one Postgres database, a one-shot
# import of the example, two stateless replicas with no volume, and HAProxy
# in front, round robin, no sticky sessions, WebSocket upgrades passed.
#
#   just image   # builds the image from the flake and tags it cartograph:local
#   just ha-up   # docker compose -f compose.ha.yaml up -d --wait
#   just ha-down # docker compose -f compose.ha.yaml down -v
#
# Open http://localhost:8080. Every response carries X-Upstream, the
# replica that served it. Stop one replica (docker compose -f
# compose.ha.yaml stop replica-a) and the other keeps serving.
#
# The password is a local placeholder. A real deployment takes the URL
# from a secret.

x-replica: &replica
  image: ${CARTOGRAPH_IMAGE:-cartograph:local}
  environment:
    CARTOGRAPH_STORE: postgres://cartograph:cartograph@postgres:5432/cartograph?sslmode=disable
    CARTOGRAPH_LOG_FORMAT: json
    CARTOGRAPH_METRICS_ADDR: ":9090"
  depends_on:
    seed:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "/bin/cartograph", "ready"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 5s
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cartograph
      POSTGRES_PASSWORD: cartograph
      POSTGRES_DB: cartograph
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartograph -d cartograph"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Imports the example once, before any replica starts. Running it again
  # on a seeded database records the same manifests again, with a new
  # version where something changed.
  seed:
    image: ${CARTOGRAPH_IMAGE:-cartograph:local}
    command:
      - import
      - -db
      - postgres://cartograph:cartograph@postgres:5432/cartograph?sslmode=disable
      - -reason
      - seed
      - /examples
    volumes:
      - ./examples/minimal:/examples:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  replica-a: *replica
  replica-b: *replica

  haproxy:
    image: haproxy:3.2-alpine
    ports:
      - "8080:8080"
    configs:
      - source: haproxy
        target: /usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      replica-a:
        condition: service_healthy
      replica-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 3

configs:
  haproxy:
    content: |
      global
        log stdout format raw local0

      defaults
        mode http
        log global
        option httplog
        # A replica on this network accepts in well under a millisecond; a
        # stopped one stops answering at all. After 1 s the request is sent
        # to the other (retries and redispatch).
        timeout connect 1s
        timeout client 60s
        timeout server 60s
        # The sync socket, once upgraded, is a tunnel: keep an idle one open
        # for an hour. The server pings well inside that.
        timeout tunnel 1h
        retries 1
        option redispatch

      frontend cartograph
        bind :8080
        option forwardfor
        http-request set-header X-Forwarded-Proto http
        default_backend replicas

      # Round robin, no cookie: any replica serves any request. Each is
      # checked on /readyz every second, so one that drains (503) leaves
      # the rotation before it stops, and comes back after two checks
      # pass. A request that cannot connect to a replica takes it out at
      # once (observe layer4) and goes to the other.
      backend replicas
        balance roundrobin
        option httpchk GET /readyz
        http-check expect status 200
        timeout check 500ms
        default-server inter 1s fall 1 rise 2 observe layer4 error-limit 1 on-error mark-down
        server replica-a replica-a:8080 check
        server replica-b replica-b:8080 check
        http-response set-header X-Upstream %s

volumes:
  postgres-data:
